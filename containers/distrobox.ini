[arch]
image=archlinux:latest
nvidia=false
pull=true
root=false
replace=true
start_now=true

[dev]
clone=arch

home=~/.var/

additional_packages="base-devel git neovim python nodejs npm dotnet-sdk rust"
additional_packages="fzf ripgrep fd jq sqlite task yt-dlp gallery-dl pandoc typst"

additional_packages="bash-language-server lua-language-server nil ruff ty shfmt stylua"

exported_bins="/usr/bin/nvim /usr/bin/task /usr/bin/yt-dlp"

pull=true
start_now=true
replace=true
